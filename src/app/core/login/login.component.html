<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<div class="min-h-screen bg-gray-100 flex items-center justify-center bg-cover bg-center px-4"
  style="background-image: url('/assets/images/agr.avif')">
  <div class="w-full max-w-5xl">
    <div class="bg-white bg-opacity-90 flex flex-col md:flex-row rounded-xl overflow-hidden shadow-lg"
      style="min-height: 60vh;">
      
      <!-- Formulario -->
      <div class="w-full md:w-1/2 p-8 flex flex-col justify-center items-center">
        <div class="text-center mb-6">
          <h1 class="text-3xl font-bold mb-6">Iniciar Sesión</h1>
        </div>

        <form class="space-y-4 w-full" (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
          <div>
            <input type="text" id="username" [(ngModel)]="loginData.username" name="username"
              placeholder="Ingrese su correo "
              class="w-full px-4 py-3 border border-black bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required #usernameField="ngModel" />
            <div *ngIf="usernameField.invalid && usernameField.touched" class="text-red-500">
              El usuario es requerido.
            </div>
          </div>

          <div class="relative">
            <input [type]="loginData.rememberMe ? 'text' : 'password'" id="password" [(ngModel)]="loginData.password"
              name="password" placeholder="Contraseña"
              class="w-full px-4 py-3 border border-black bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required #passwordField="ngModel" />
            <button type="button" class="absolute right-4 top-1/2 transform -translate-y-1/2"
              (click)="loginData.rememberMe = !loginData.rememberMe">
              <i [class]="loginData.rememberMe ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
            </button>

            <!-- Mensaje de error para el campo password -->
            <div *ngIf="passwordField.invalid && passwordField.touched" class="text-red-500">
              La contraseña es requerida.
            </div>
          </div>

          <!-- Recordarme y Olvidé contraseña en línea -->
          <div class="flex items-center justify-between">
            <label class="inline-flex items-center">
              <input type="checkbox" [(ngModel)]="loginData.rememberMe" name="rememberMe"
                class="form-checkbox h-5 w-5 text-blue-600" />
              <span class="ml-2 text-gray-700 select-none">Recordarme</span>
            </label>

            <a routerLink="/forgot-password" class="text-blue-600 hover:text-blue-700 text-sm">¿Olvidaste tu
              contraseña?</a>
          </div>

          <!-- Mensaje de error general -->
          <div *ngIf="errorMessage" class="text-red-500 text-center">
            {{ errorMessage }}
          </div>

          <button type="submit"
            class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition duration-200 ease-in-out"
            [disabled]="loginForm.invalid">
            <span>Iniciar Sesión</span>
          </button>

          <div class="text-center mt-4">
            <span class="text-gray-600">¿No tienes una cuenta? </span>
            <a routerLink="/register" class="text-blue-600 hover:text-blue-700">
              Crear Cuenta
            </a>
          </div>
        </form>
      </div>

      <!-- Imagen -->
      <div class="hidden md:flex md:w-1/2 items-center justify-center p-4">
        <img src="/assets/images/agroInversiones-Photoroom.png" alt="Jardín del Edén Logo"
          class="max-w-full max-h-[80vh] object-contain" />
      </div>
    </div>
  </div>
</div>
