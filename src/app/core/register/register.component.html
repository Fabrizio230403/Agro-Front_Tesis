<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<div class="min-h-screen bg-gray-100 flex items-center justify-center bg-cover bg-center"
  style="background-image: url('/assets/images/agr.avif')">
  <div class="w-full max-w-5xl mx-4">
    <div
      class="bg-white bg-opacity-90 rounded-lg shadow-xl flex flex-col md:flex-row h-auto md:min-h-[70vh] lg:min-h-[60vh]">

      <!-- Imagen ajustada para que no se desborde -->
      <div class="hidden md:flex md:w-1/2 items-center justify-center p-4">
        <img src="/assets/images/agroInversiones-Photoroom.png" alt="Jardín del Edén Logo"
          class="max-w-full max-h-full object-contain" />
      </div>

      <!-- Formulario Crear Cuenta -->
      <div class="w-full md:w-1/2 p-8 flex flex-col justify-center">
        <div class="text-center mb-6">
          <h1 class="text-3xl font-bold mb-6">Crear Cuenta</h1>
        </div>
        <form class="form-signin" (ngSubmit)="onRegister()" #registerForm="ngForm" class="space-y-2">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
              class="w-full px-4 py-3 border border-black bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Username" required [(ngModel)]="user.username" #username="ngModel" />
            <div *ngIf="username.invalid && username.touched" class="text-danger">
              Username is required.
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
              class="w-full px-4 py-3 border border-black bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Email" required [(ngModel)]="user.email" #email="ngModel" />
            <div *ngIf="email.invalid && email.touched" class="text-danger">
              A valid email is required.
            </div>
          </div>

          <div class="relative">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
              class="w-full px-4 py-3 border border-black bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-10"
              placeholder="Password" required [(ngModel)]="user.password" #password="ngModel" />
            <div *ngIf="password.invalid && password.touched" class="text-danger">
              Password is required.
            </div>
            <button type="button" class="absolute right-3 top-0 bottom-0 h-full flex items-center justify-center px-3"
              (click)="togglePasswordVisibility('password', 'passwordIcon')">
              <i id="passwordIcon" class="fas fa-eye-slash"></i>
            </button>
          </div>

          <div class="relative mt-4">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
              class="w-full px-4 py-3 border border-black bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-10"
              placeholder="Confirm Password" required [(ngModel)]="confirmPassword" #confirmPasswordField="ngModel" />
            <button type="button" class="absolute right-3 top-0 bottom-0 h-full flex items-center justify-center px-3"
              (click)="togglePasswordVisibility('confirmPassword', 'confirmPasswordIcon')">
              <i id="confirmPasswordIcon" class="fas fa-eye-slash"></i>
            </button>
            <div *ngIf="passwordsDontMatch && confirmPasswordField.touched" class="text-danger">
              Las contraseñas no coinciden
            </div>
          </div>


          <div class="flex items-start">
            <input type="checkbox" id="terms"
              class="mt-1 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" required />
            <label for="terms" class="ml-2 text-sm text-gray-700">
              Acepto los
              <a href="#" class="text-blue-600 hover:text-blue-700">Términos y Condiciones</a>
              y la
              <a href="#" class="text-blue-600 hover:text-blue-700">Política de Privacidad</a>
            </label>
          </div>
          <button
            class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition duration-200 ease-in-out"
            type="submit" [disabled]="registerForm.invalid || passwordsDontMatch">
            Register
          </button>


          <div class="text-center mt-4">
            <span class="text-gray-600">¿Ya tienes una cuenta? </span>
            <a routerLink="/login" class="text-blue-600 hover:text-blue-700">Inicia Sesión</a>
          </div>
          <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
          <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
        </form>
        <div *ngIf="successMessage" class="alert alert-success mt-3">
          {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger mt-3">
          {{ errorMessage }}
        </div>

      </div>
    </div>
  </div>
</div>
