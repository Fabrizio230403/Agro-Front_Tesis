<header class="bg-white text-gray-800 p-4 flex justify-between items-center shadow-md z-10 relative">
    <button (click)="toggleSidebar()" class="text-gray-600 hover:text-blue-600 focus:outline-none p-2 rounded">
        <!-- Icono Font Awesome -->
        <i class="fas text-xl" [ngClass]="isSidebarVisible ? 'fa-times' : 'fa-bars'">
        </i>
    </button>
    <button (click)="abrirCarrito()" class="relative text-gray-600 hover:text-blue-600 focus:outline-none">
        <i class="fas fa-shopping-cart text-2xl"></i>
        <!-- Contador del carrito -->
        <span *ngIf="cantidadCarrito > 0"
            class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">
            {{ cantidadCarrito }}
        </span>
    </button>
</header>
