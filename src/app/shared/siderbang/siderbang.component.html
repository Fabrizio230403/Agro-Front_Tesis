<!-- aside.component.html -->
<aside class="sidebar w-64 flex-shrink-0 h-full overflow-y-auto bg-gray-800 flex flex-col shadow-lg text-gray-300">
    
    <!-- Perfil de Usuario -->
    <div class="p-4 text-center border-b border-gray-700">
        <img src="../../../assets/images/perfilFoto.png" alt="Foto de perfil" 
             class="rounded-full mx-auto border-4 border-gray-600"
             style="width: 120px; height: 120px;">
        <h3 class="mt-3 font-bold text-lg text-white">{{ username }}</h3>
        <p class="text-sm text-gray-400">{{ rol }}</p>
        <a routerLink="/perfil" class="text-blue-400 hover:text-blue-300 text-sm underline transition-colors duration-200">Ver Perfil</a>
    </div>

    <!-- Navegación Principal -->
    <nav class="flex-grow p-2">
        <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-tachometer-alt w-6 text-center"></i>
            <span>DASHBOARD</span>
        </a>
        <a  routerLink="/user" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-user-shield w-6 text-center"></i>
            <span>USUARIOS</span>
        </a>
        <a  routerLink="/roles" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-user-tag w-6 text-center"></i> <!-- Ícono cambiado para diferenciar -->
            <span>ROLES</span>
        </a>
        <a  routerLink="/clientes" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-users w-6 text-center"></i>
            <span>CLIENTES</span>
        </a>
        <a  routerLink="/productos" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-box w-6 text-center"></i>
            <span>PRODUCTOS</span>
        </a>
        <a  routerLink="/categorias" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-th-large w-6 text-center"></i>
            <span>CATEGORÍAS</span>
        </a>
        <a  routerLink="/inventario" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-warehouse w-6 text-center"></i>
            <span>INVENTARIO</span>
        </a>
        <a  routerLink="/proveedores" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-truck w-6 text-center"></i>
            <span>PROVEEDORES</span>
        </a>
        <a  routerLink="/ventas" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-shopping-cart w-6 text-center"></i>
            <span>NUEVA VENTA</span>
        </a>
        <a  routerLink="/reportes" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-chart-line w-6 text-center"></i>
            <span>REPORTES</span>
        </a>
         <a  routerLink="/gestion" routerLinkActive="active" class="sidebar-link">
            <i class="fas fa-cogs w-6 text-center"></i>
            <span>GESTIÓN</span>
        </a>
    </nav>

    <!-- Botón de Cerrar Sesión -->
    <div class="p-2 border-t border-gray-700">
        <a (click)="logout()" class="sidebar-link logout-link">
            <i class="fas fa-sign-out-alt w-6 text-center"></i>
            <span>CERRAR SESIÓN</span>
        </a>
    </div>
</aside>
