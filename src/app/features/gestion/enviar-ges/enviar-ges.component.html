<!-- Modal de Envío con Destinatario (Estilo Final Frontend) -->
<div *ngIf="isVisible" 
     class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 animate-fade-in">
    
    <!-- Contenedor del Modal -->
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl flex flex-col m-4 p-4">

        <!-- 1. Encabezado del Modal -->
        <div class="flex justify-between items-center pb-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800">Compartir Documento</h2>
            <button (click)="cerrarModal()" type="button" class="text-gray-400 hover:text-gray-600 p-1 rounded-full transition-colors duration-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- 2. Formulario de envío -->
        <form (ngSubmit)="enviarDocumento()" class="mt-6">
            <div class="space-y-5">
                
                <!-- Campo para seleccionar el método (Dropdown/Combo) -->
                <div>
                    <label for="metodo" class="block text-sm font-medium text-gray-700 mb-1">Método de envío</label>
                    <select id="metodo" 
                            [(ngModel)]="metodoSeleccionado" name="metodo" 
                            class="w-full border border-gray-300 rounded-md p-2 shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="email">Email</option>
                        <option value="whatsapp">WhatsApp</option>
                    </select>
                </div>

                <!-- Campo para el destinatario (Input dinámico) -->
                <div>
                    <label for="destinatario" class="block text-sm font-medium text-gray-700 mb-1">
                        {{ metodoSeleccionado === 'email' ? 'Email del destinatario' : 'Número de WhatsApp' }}
                    </label>
                    <input id="destinatario"
                           [type]="metodoSeleccionado === 'email' ? 'email' : 'tel'"
                           [(ngModel)]="destinatario"
                           name="destinatario"
                           [placeholder]="metodoSeleccionado === 'email' ? 'ejemplo@correo.com' : 'Ej: 51987654321'"
                           required
                           class="w-full border border-gray-300 rounded-md p-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <p *ngIf="metodoSeleccionado === 'whatsapp'" class="text-xs text-gray-500 mt-1">
                        Incluye el código de país sin el símbolo '+'.
                    </p>
                </div>
            </div>

            <!-- Botón de Envío -->
            <div class="mt-8 pt-5 border-t border-gray-200 flex justify-end">
                <button type="submit" 
                        [disabled]="!destinatario"
                        class="inline-flex justify-center py-2 px-6 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                    Abrir y Enviar
                </button>
            </div>
        </form>
    </div>
</div>
