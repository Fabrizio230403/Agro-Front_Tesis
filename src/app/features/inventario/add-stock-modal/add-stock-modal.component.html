 <div class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50 p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-0 relative flex flex-col" style="max-height: 90vh;">
    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t">
      <h3 class="text-lg font-semibold text-gray-900">
        Añadir Stock a: {{ productSelectedForStock?.productName }} ({{ productSelectedForStock?.productCode }})
      </h3>
      <button (click)="onClose()" type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
      </button>
    </div>
    <form (ngSubmit)="onSaveStock()" class="p-4 md:p-5 flex-grow overflow-y-auto">
      <div class="space-y-4">
        <div>
          <label for="quantity" class="block mb-2 text-sm font-medium text-gray-900">Cantidad a Añadir</label>
          <input type="number" name="quantity" id="quantity" [(ngModel)]="quantity" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5" placeholder="0" required min="1">
        </div>
        <!-- Si necesitas el costo unitario en el futuro, puedes añadir el campo aquí -->
        <!--
        <div>
          <label for="unitCost" class="block mb-2 text-sm font-medium text-gray-900">Costo Unitario (S/)</label>
          <input type="number" name="unitCost" id="unitCost" [(ngModel)]="unitCost" step="0.01" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5" placeholder="0.00" min="0">
        </div>
        -->
      </div>
      <div class="flex items-center justify-end p-4 md:p-5 border-t border-gray-200 rounded-b mt-4">
        <button type="submit" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Guardar Stock</button>
        <button (click)="onClose()" type="button" class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-200">Cancelar</button>
      </div>
    </form>
  </div>
</div>
