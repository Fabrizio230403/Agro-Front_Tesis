<div class="dashboard-layout flex flex-col h-screen bg-gray-50">
  <div class="main-container flex h-full">
    <!-- Sidebar -->
    <app-siderbang *ngIf="isSidebarVisible" class="siderbang w-64"></app-siderbang>

    <!-- Main Content Area -->
    <div class="content-area flex flex-col flex-grow overflow-y-auto min-w-0">
      <!-- Header -->
      <app-header (sidebarToggle)="toggleSidebar()"></app-header>

      <!-- Content Padding Wrapper -->
      <div class="p-4 md:p-6">
        <!-- Page Title -->
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6">Gestión de Categorías</h1>

        <!-- Filters and Actions Section -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <!-- Filter Group -->
            <div class="flex flex-wrap items-center gap-3 flex-grow">
                <!-- Dropdown Campo de Búsqueda -->
                <div class="relative">
                    <select id="searchField" name="searchField" [(ngModel)]="filtroCampo"
                    class="appearance-none w-full md:w-auto bg-white border border-gray-300 text-gray-700 py-2 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-gray-500 transition ease-in-out duration-150 shadow-sm">
                        <option value="" disabled selected>Filtrar por...</option>
                        <option value="name">Nombre</option>
                        <option value="description">Descripción</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" /></svg>
                    </div>
                </div>
                <!-- Input de Búsqueda -->
                <div class="flex-grow min-w-[200px]">
                    <input type="text" id="searchTerm" name="searchTerm" [(ngModel)]="filtroTermino" placeholder="Buscar término..."
                    (keyup)="filtrarCategorias()"
                    class="w-full bg-white border border-gray-300 rounded-lg py-2 px-4 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-gray-500 transition ease-in-out duration-150 shadow-sm">
                </div>
            </div>
            <!-- Add Button -->
            <div class="flex-shrink-0">
                <button (click)="abrirAgregarCategoriaModal()" class="inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow transition duration-150 ease-in-out flex items-center justify-center space-x-2 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
                    Agregar Categoría
                </button>
            </div>
        </div>

        <!-- Categories Table -->
        <div class="table-container bg-white shadow-md rounded-lg overflow-x-auto">
          <table class="clientes-table w-full min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-100">
              <tr>
                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border border-gray-300">Nombre</th>
                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border border-gray-300">Descripción</th>
                <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider border border-gray-300">Imagen</th>
                <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider border border-gray-300">Acciones</th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
              <tr *ngFor="let categoria of categoriasPaginadas" class="hover:bg-gray-50 transition-colors duration-150">
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700 border border-gray-300">{{ categoria.name }}</td>
                <td class="px-4 py-3 text-sm text-gray-500 border border-gray-300">{{ categoria.description }}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 border border-gray-300 text-center">
                  <img [src]="categoria.image" alt="{{ categoria.name }}" class="w-12 h-12 object-cover rounded-md mx-auto">
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-sm font-medium border border-gray-300 text-center">
                  <div class="flex justify-center items-center space-x-4">
                    <button (click)="abrirEditarCategoriaModal(categoria)" class="p-1 text-blue-600 hover:text-blue-800 hover:bg-blue-100 rounded transition-colors duration-150">
                      <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path
                          d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z">
                        </path>
                      </svg>
                    </button>
                    <button (click)="eliminarCategoria(categoria)" class="p-1 text-red-600 hover:text-red-800 hover:bg-red-100 rounded transition-colors duration-150">
                      <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                          d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                          clip-rule="evenodd"></path>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="!categoriasPaginadas || categoriasPaginadas.length === 0">
                <td colspan="4" class="px-6 py-4 text-center text-gray-500 border border-gray-300">
                  No se encontraron categorías.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div *ngIf="getTotalPaginas() > 1" class="pagination mt-6 flex flex-wrap justify-center items-center gap-2 sm:gap-3">
          <button class="flex items-center gap-1 px-3 py-1.5 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="currentPage === 1" (click)="cambiarPagina('anterior')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" class="fill-current"><path d="M12.707 17.293 8.414 13H18v-2H8.414l4.293-4.293-1.414-1.414L4.586 12l6.707 6.707z"></path></svg>
            
          </button>

          <span class="px-3 py-1 text-sm text-gray-700">
            Página {{ currentPage }} de {{ getTotalPaginas() }}
          </span>

          <button class="flex items-center gap-1 px-3 py-1.5 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="currentPage === getTotalPaginas()" (click)="cambiarPagina('siguiente')">
            
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" class="fill-current"><path d="m11.293 17.293 1.414 1.414L19.414 12l-6.707-6.707-1.414 1.414L15.586 11H6v2h9.586z"></path></svg>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Modals remain outside the main content flow -->
  <app-agregar-categoria *ngIf="agregarCategoriaModalVisible" (cerrarModal)="cerrarAgregarCategoriaModal()" (categoriaAgregada)="abrirAgregarCategoriaModal()"></app-agregar-categoria>
  <app-editar-categoria *ngIf="editarCategoriaModalVisible" (cerrarModal)="cerrarEditarCategoriaModal()" [categoriaSeleccionada]="categoriaSeleccionada" (categoriaEditada)="abrirAgregarCategoriaModal()"></app-editar-categoria>
</div>
