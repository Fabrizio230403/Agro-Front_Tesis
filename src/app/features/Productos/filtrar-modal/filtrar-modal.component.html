<div class="dashboard-layout flex flex-col h-screen">
  <div class="main-container flex h-full">
    <!-- Sidebar -->
    <app-siderbang *ngIf="isSidebarVisible" class="siderbang"></app-siderbang>

    <!-- Contenido principal -->
    <div class="content-area flex flex-col flex-grow overflow-y-auto min-w-0">
      <!-- Header -->
      <app-header (sidebarToggle)="toggleSidebar()"></app-header>

      <!-- Contenedor de Categorías -->
      <div class="container mx-auto p-4">
        <!-- Título del módulo -->
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-semibold text-gray-800">Gestión de Categorías</h2>
        </div>

        <!-- Filtros -->
        <div class="flex justify-between items-center mb-6">
          <!-- Dropdown Campo de Búsqueda -->
          <div class="w-full md:w-auto md:flex-shrink-0 relative">
            <select id="searchField" name="searchField" [(ngModel)]="filtroCampo"
              class="appearance-none w-full bg-white border border-gray-300 text-gray-600 py-2 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition ease-in-out duration-150 shadow-sm">
              <option value="" disabled selected>Seleccione un campo</option>
              <option value="name">Nombre</option>
              <option value="description">Descripción</option>
            </select>

            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
              <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
              </svg>
            </div>
          </div>

          <!-- Input de Búsqueda -->
          <div class="w-full md:flex-grow">
            <input type="text" id="searchTerm" name="searchTerm" [(ngModel)]="filtroTermino" placeholder="Buscar..."
              (keyup)="filtrarCategorias()"
              class="w-full bg-white border border-gray-300 rounded-lg py-2 px-4 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-gray-500 transition ease-in-out duration-150 shadow-sm">
          </div>
        </div>

        <!-- Botones de acción -->
        <div class="flex justify-between items-center mb-6">
          <button (click)="abrirAgregarCategoriaModal()"
            class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 transition duration-200">
            + Agregar Categoría
          </button>
        </div>

        <!-- Tabla de Categorías -->
        <div class="relative overflow-y-auto border border-gray-300 rounded-lg shadow-md">
          <table class="w-full table-auto">
            <thead class="bg-gray-200">
              <tr>
                <th class="py-2 px-4 text-center font-semibold">Nombre</th>
                <th class="py-2 px-4 text-center font-semibold">Descripción</th>
                <th class="py-2 px-4 text-center font-semibold">Imagen</th>
                <th class="py-2 px-4 text-center font-semibold">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let categoria of categoriasPaginadas">
                <td class="py-2 px-4 text-center">{{ categoria.name }}</td>
                <td class="py-2 px-4 text-center">{{ categoria.description }}</td>
                <td class="py-2 px-4 text-center">
                  <img [src]="categoria.image" alt="{{ categoria.name }}" class="max-h-10 mx-auto">
                </td>
                <td class="py-2 px-4 text-center">
                  <div class="flex justify-center space-x-4">
                    <button (click)="abrirEditarCategoriaModal(categoria)"
                      class="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600 transition duration-200">
                      Editar
                    </button>
                    <button (click)="eliminarCategoria(categoria)"
                      class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600 transition duration-200">
                      Eliminar
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Paginación -->
        <div class="pagination mt-6 flex justify-center items-center space-x-2">
          <button
            class="px-3 py-1 border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="currentPage === 1" (click)="cambiarPagina('anterior')">
            Anterior
          </button>

          <span class="px-3 py-1 text-sm text-gray-700">
            Página {{ currentPage }} de {{ getTotalPaginas() }}
          </span>

          <button
            class="px-3 py-1 border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="currentPage === getTotalPaginas()" (click)="cambiarPagina('siguiente')">
            Siguiente
          </button>
        </div>
      </div>

      <!-- Modales de Categorías -->
      <app-agregar-categoria *ngIf="agregarCategoriaModalVisible" (cerrarModal)="cerrarAgregarCategoriaModal()"
        (categoriaAgregada)="abrirAgregarCategoriaModal()">
      </app-agregar-categoria>

      <app-editar-categoria *ngIf="editarCategoriaModalVisible" (cerrarModal)="cerrarEditarCategoriaModal()"
        [categoriaSeleccionada]="categoriaSeleccionada" (categoriaEditada)="abrirAgregarCategoriaModal()">
      </app-editar-categoria>
    </div>
  </div>
</div>
