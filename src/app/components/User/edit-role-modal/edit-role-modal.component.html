<!-- =================================================================== -->
<!-- MODAL EDITAR ROL (REDISEÑADO CON CLASES DE UTILIDAD) -->
<!-- =================================================================== -->
<div class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50" (click.self)="onClose()">

    <!-- 1. Contenedor principal del modal (tarjeta) -->
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col m-4" style="max-height: 90vh;">

        <!-- 2. Encabezado del Modal -->
        <div class="flex-shrink-0 flex justify-between items-center p-5 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-900">Editar Rol</h2>
            <button (click)="onClose()" type="button" class="text-gray-400 hover:text-gray-600 p-1 rounded-full transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- 3. Cuerpo del Modal (Formulario) -->
        <div class="flex-grow p-6 space-y-5 overflow-y-auto">
            
            <!-- Selector de rol -->
            <div>
                <!-- Label con el estilo de los modales de referencia -->
                <label for="rolSelector" class="block text-sm font-medium text-gray-700 mb-1.5">Seleccionar nuevo rol:</label>
                <div class="relative">
                    <!-- Select con el estilo completo -->
                    <select id="rolSelector" [(ngModel)]="selectedRoleId" (change)="onRoleChange(selectedRoleId)"
                        class="appearance-none w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-shadow duration-200 pr-10">
                        <option *ngFor="let role of allRoles" [value]="role.id">{{ role.roleName }}</option>
                    </select>
                    <!-- Flecha personalizada para el select -->
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" /></svg>
                    </div>
                </div>
            </div>

            <!-- Descripción del rol -->
            <div>
                <!-- Label con el estilo de los modales de referencia -->
                <label for="rolDescription" class="block text-sm font-medium text-gray-700 mb-1.5">Descripción del rol:</label>
                <!-- Textarea con el estilo completo -->
                <textarea id="rolDescription" [(ngModel)]="description" rows="4" 
                    class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-shadow duration-200"
                    placeholder="Escribe una descripción..."></textarea>
            </div>
        </div>

        <!-- 4. Pie del Modal (Botones de Acción) -->
        <div class="flex-shrink-0 flex justify-end items-center gap-3 p-5 bg-gray-50 border-t border-gray-200 rounded-b-xl">
            <!-- Botón Cancelar (Secundario) -->
            <button type="button" (click)="onBack()" 
                class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-white text-gray-700 border border-gray-300 text-sm font-semibold rounded-lg shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 transition-colors duration-200">
                Cancelar
            </button>
            <!-- Botón Guardar (Primario) -->
            <button type="button" (click)="onSave()" 
                class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200 disabled:opacity-50">
                Guardar Cambios
            </button>
        </div>
    </div>
</div>
