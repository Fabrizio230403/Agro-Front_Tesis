<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" (click.self)="onClose()">
    <div class="bg-white w-11/12 sm:w-[480px] rounded-lg p-6 shadow-xl">
        <!-- Encabezado -->
        <div class="relative mb-6 flex justify-center items-center">
            <!-- Título centrado -->
            <h2 class="text-xl font-bold text-center text-gray-800">Editar Rol</h2>
        </div>

        <!-- Selector de rol -->
        <label class="block text-gray-700 font-semibold mb-2">Seleccionar nuevo rol:</label>
        <select [(ngModel)]="selectedRoleId" (change)="onRoleChange(selectedRoleId)"
            class="w-full border border-gray-300 rounded px-3 py-2 mb-4">
            <option *ngFor="let role of allRoles" [value]="role.id">{{ role.roleName }}</option>
        </select>

        <!-- Descripción del rol -->
        <label class="block text-gray-700 font-semibold mb-2">Descripción del rol:</label>
        <textarea [(ngModel)]="description" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 mb-4"
            placeholder="Escribe una descripción..."></textarea>

        <!-- Botones centrados -->
        <div class="flex justify-center gap-4">
            <button (click)="onBack()"
                class="px-4 py-2 rounded bg-red-500 hover:bg-red-600 text-white">Cancelar</button>
            <button (click)="onSave()" class="px-4 py-2 rounded bg-green-600 hover:bg-green-700 text-white">Guardar
                cambios</button>
        </div>
    </div>
</div>
