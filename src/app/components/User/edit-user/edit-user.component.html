<div
  class="fixed inset-0 z-50 flex items-center justify-center overflow-x-hidden overflow-y-auto bg-black bg-opacity-30">
  <!-- Modal Blanco principal con altura dinámica -->
  <div class="relative w-full max-w-4xl mx-auto my-10 bg-white rounded-xl shadow-xl p-6">

    <!-- Título centrado con texto pequeño -->
    <h3 class="text-lg font-semibold text-center text-black mb-4">Editar Usuario</h3>

    <!-- Modal Gris interior (más oscuro) -->
    <form (ngSubmit)="updateUser($event)" class="bg-gray-300 p-6 rounded-xl shadow-md w-full">
      <div class="flex flex-col md:flex-row gap-6">

        <!-- Foto cuadrada con bordes redondeados -->
        <!-- Foto cuadrada con bordes redondeados e ícono de subir imagen -->
        <div class="flex justify-center items-center md:w-1/3">
          <div
            class="w-40 h-40 bg-white border border-gray-400 rounded-2xl flex items-center justify-center shadow cursor-pointer hover:bg-gray-100 transition">
            <!-- Ícono de subir imagen -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-500" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0l-4 4m4-4l4 4" />
            </svg>
          </div>
        </div>

        <!-- Campos -->
        <div class="md:w-2/3 space-y-4">
          <div>
            <label for="username" class="block mb-1 text-sm font-medium text-gray-700">Nombre de Usuario</label>
            <input id="username" [(ngModel)]="user.username" name="username" type="text"
              class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required />
          </div>

          <div>
            <label for="email" class="block mb-1 text-sm font-medium text-gray-700">Correo</label>
            <input id="email" [(ngModel)]="user.email" name="email" type="email"
              class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required />
          </div>

          <div>
            <label for="phone" class="block mb-1 text-sm font-medium text-gray-700">Teléfono</label>
            <input id="phone" [(ngModel)]="user.telefono" name="phone" type="text"
              class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required />
          </div>

          <div>
            <label for="status" class="block mb-1 text-sm font-medium text-gray-700">Estado</label>
            <select id="status" [(ngModel)]="user.enabled" name="status"
              class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required>
              <option [ngValue]="true">Activo</option>
              <option [ngValue]="false">Inactivo</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Botones centrados -->
      <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8">
        <button type="button"
          class="px-4 py-2 text-sm font-bold text-yellow-900 uppercase bg-yellow-400 rounded hover:bg-yellow-500"
          (click)="openEditPermissionsModal(user?.rol?.id, user?.rol?.permissions)">
          Editar Permisos
        </button>
        <button type="submit"
          class="px-4 py-2 text-sm font-bold text-white uppercase bg-green-600 rounded hover:bg-green-700"
          (click)="updateUser()">
          Guardar Cambios
        </button>
        <button type="button"
          class="px-4 py-2 text-sm font-bold text-white uppercase bg-blue-600 rounded hover:bg-blue-700"
          (click)="viewUserDetails()">
          Ver Detalles
        </button>
      </div>

      <!-- Modal Editar Permisos -->
      <app-edit-permissions-modal *ngIf="showEditPermissionsModal" [roleId]="selectedRoleId"
        [userExistingPermissions]="selectedUserPermissions" (close)="showEditPermissionsModal = false"
        (save)="handleSavePermissions($event)">
      </app-edit-permissions-modal>

      <!-- Modal detalles del usuario -->
      <div *ngIf="showDetails" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-30">
        <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-xl relative">
          <app-user-details [user]="user" (close)="closeDetails()" (back)="handleBackFromDetails()"></app-user-details>
          <!-- ELIMINÉ el botón "×" de aquí -->
        </div>
      </div>

    </form>

    <!-- Botón cerrar (azul) -->
    <button (click)="cancelEdit()"
      class="absolute top-3 right-4 text-3xl font-bold text-blue-600 hover:opacity-100 opacity-70">
      ×
    </button>
  </div>
</div>
