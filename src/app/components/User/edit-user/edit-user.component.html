<!-- Modal de Edición de Usuario (Rediseñado) -->
<div class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50">
  <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-4xl">

    <!-- 2. Encabezado con título a la izquierda y botón de cerrar a la derecha -->
    <div class="flex justify-between items-center pb-4 mb-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-800">Editar Usuario</h2>
      <button (click)="cancelEdit()" type="button" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- 3. Formulario principal -->
    <form (ngSubmit)="updateUser($event)">
      <div class="flex flex-col md:flex-row gap-8">

        <!-- Columna Izquierda: Foto de perfil -->
        <div class="flex-shrink-0 flex flex-col items-center md:w-1/3 space-y-2">
          <label class="block text-sm font-medium text-gray-700">Foto de Perfil</label>
          <div
            class="w-40 h-40 bg-gray-100 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center shadow-sm cursor-pointer hover:bg-gray-200 hover:border-blue-400 transition">
            <!-- Ícono de subir imagen -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0l-4 4m4-4l4 4" />
            </svg>
          </div>
        </div>

        <!-- Columna Derecha: Campos de datos -->
        <div class="flex-grow md:w-2/3 grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario</label>
            <input id="username" [(ngModel)]="user.username" name="username" type="text"
              class="w-full border border-gray-300 rounded-md p-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required />
          </div>

          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
            <input id="phone" [(ngModel)]="user.telefono" name="phone" type="text"
              class="w-full border border-gray-300 rounded-md p-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required />
          </div>

          <div class="sm:col-span-2">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input id="email" [(ngModel)]="user.email" name="email" type="email"
              class="w-full border border-gray-300 rounded-md p-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required />
          </div>

          <div class="sm:col-span-2">
            <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
            <select id="status" [(ngModel)]="user.enabled" name="status"
              class="w-full border border-gray-300 rounded-md p-2 shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required>
              <option [ngValue]="true">Activo</option>
              <option [ngValue]="false">Inactivo</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 4. Botones alineados a la derecha con separador -->
      <div class="flex justify-between items-center mt-8 border-t border-gray-200 pt-4">
        <!-- Botones de acciones secundarias (a la izquierda) -->
        <div class="flex gap-3">
            <button type="button"
              (click)="openEditPermissionsModal(user?.rol?.id, user?.rol?.permissions)"
              class="px-4 py-2 text-sm font-medium text-yellow-800 bg-yellow-100 hover:bg-yellow-200 border border-yellow-300 rounded-md shadow-sm">
              Editar Permisos
            </button>
            <button type="button" (click)="viewUserDetails()"
              class="px-4 py-2 text-sm font-medium text-gray-700 bg-white hover:bg-gray-100 border border-gray-300 rounded-md shadow-sm">
              Ver Detalles
            </button>
        </div>

        <!-- Botones de acción principal (a la derecha) -->
        <div class="flex gap-3">
          <button type="button" (click)="cancelEdit()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-md shadow-sm">
            Cancelar
          </button>
          <button type="submit"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md shadow-sm disabled:opacity-50">
            Guardar Cambios
          </button>
        </div>
      </div>
    </form>
    
    <!-- Estos modales anidados no necesitan cambios de estilo, pero los mantenemos aquí -->
    <app-edit-permissions-modal *ngIf="showEditPermissionsModal" [roleId]="selectedRoleId"
      [userExistingPermissions]="selectedUserPermissions" (close)="showEditPermissionsModal = false"
      (save)="handleSavePermissions($event)">
    </app-edit-permissions-modal>

    <div *ngIf="showDetails" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-30">
      <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-xl relative">
        <app-user-details [user]="user" (close)="closeDetails()" (back)="handleBackFromDetails()"></app-user-details>
      </div>
    </div>
    
  </div>
</div>
